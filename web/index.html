<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마라톤 코스 모아보기 & 교통 정보</title>
  <link rel="stylesheet" href="style.css">
  <!-- CSV 읽기 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>

  <!-- 1. 제목 -->
  <header>
    <h1>마라톤 코스 모아보기 & 교통 정보</h1>
  </header>

  <!-- 2. 월 선택 -->
  <nav class="months">
    <button class="month" data-month="2026-11">2026년 11월</button>
    <button class="month" data-month="2026-12">2026년 12월</button>
  </nav>

  <main>
    <!-- 왼쪽: 대회 목록 + 지도 -->
    <section class="left">
      <div class="box">
        <h2>대회 목록</h2>
        <!-- 월을 고르면 app.js가 여기에 표를 채움 -->
        <table id="race-table">
          <thead>
            <tr><th>날짜</th><th>대회명</th><th>종목</th><th>장소</th><th>교통통제</th></tr>
          </thead>
          <tbody>
            <tr><td colspan="5" class="empty">위에서 월을 선택하세요</td></tr>
          </tbody>
        </table>
      </div>

      <div class="box">
        <h2>코스 지도 <span id="map-title"></span></h2>
        <!-- TODO(지도 담당): 선택한 대회 코스를 이 div 안에 그리기 (data/waypoints.csv 사용) -->
        <div id="map" class="placeholder">대회를 클릭하면 코스 지도가 나와요</div>
      </div>
    </section>

    <!-- 오른쪽: 교통통제 정보 -->
    <aside class="right box">
      <h2>교통통제 정보</h2>
      <!-- TODO(교통통제 담당): 선택한 대회의 통제 여부·구간·시간 보여주기 -->
      <div id="traffic" class="placeholder">대회를 클릭하면 교통통제 정보가 나와요</div>
    </aside>
  </main>

  <!-- 3. 하단 질문 버튼 -->
  <footer class="box">
    <h2>자주 묻는 질문</h2>
    <!-- TODO(FAQ 담당): 버튼 문구와 답변 채우기 (app.js의 FAQ 목록) -->
    <div id="faq-buttons"></div>
    <div id="faq-answer" class="placeholder">버튼을 누르면 답변이 나와요</div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
